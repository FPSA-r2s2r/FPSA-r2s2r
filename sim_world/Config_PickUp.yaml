simulation: Sim_PickUp
sim_init:
  use_egl: true
  offset: [0.0, 0.0, 0.0]
  randomize_initial_ee_pose: true
demo:
  seed: 97
  time_step: 1 / 120
  record_every_n_sim_steps: 12
  max_steps: 0
  sleep_seconds: 0.0
mp_collect:
  output_root: /mnt/storage/FPSA_data/task_pickup/
  num_episodes: 3000
  num_processes: 10
  base_seed: 43
  time_step: 1 / 120
  fps: 10
  max_steps: 2000
  record_every_n_sim_steps: 12
  restart_every: 1
make_scene:
  env_mesh_path: data/background/repaired_table/tabletop.obj
  manipulated_obj_path: data/objects/bracket/bracket.obj
  initial_grasp_path: data/objects/bracket/bracket_grasp.yaml
  if_FPSA: true
  fpsa_aug_root: data/objects/bracket/fpsa_aug_outputs
  fpsa_include_base: true
  obj_pose_base:
  - 0.55
  - 0.0
  - 0.1
  obj_euler_base:
  - 0.0
  - 0.0
  - 0.0
  randomize_lighting: true
  randomize_outlscene: true
  outlscene_xyz_jit: 0.015
  outlscene_eul_jit: 0.001
  randomize_plane_height: true
  plane_height_jit: 0.002
  randomize_objpose: true
  obj_x_jit: 0.15
  obj_y_jit: 0.2
  obj_z_eul_jit: 3.141592653589793
  randomize_campose: true
  cam_xyz_jit: 0.004
  cam_eul_jit: 0.002
  randomize_image_noise: true
  randomize_object_color: true
  object_color_mode: bounded
  object_color_strength: 1.0
  randomize_distractors: true
  distractor_root: /mnt/storage/GoogleScannedObjects
  distractor_num_range:
  - 0
  - 5
  distractor_target_size_range:
  - 0.06
  - 0.4
  distractor_workspace:
  - - -0.2
    - 0.8
  - - -0.72
    - 0.42
  distractor_min_target_mask_pixels: 10
collect_observation:
  direct: false
