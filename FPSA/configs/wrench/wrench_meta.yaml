object:
  obj_path: ./data/objects/wrench/wrench.obj
  name: wrench

tcp:
  translation: [0.06989, 0.0, 0.0]

sampler:
  max_workers: 20
  labels: [chain_y_and_slippage, chain_z_and_slippage, 
            chain_yz_and_slippage, chain_yz_minus_and_slippage,
            slippage_x_stretch ]
  linspace_points_per_stage: 5

output:
  root: ./data/objects/wrench/fpsa_aug_outputs
  overwrite: true

deformations:
  - label: chain_y_and_slippage
    chain: ARAP_y_stretch, slippage_x_stretch
    
  - label: chain_z_and_slippage
    chain: ARAP_z_stretch, slippage_x_stretch

  - label: chain_yz_and_slippage
    chain: ARAP_yz_stretch, slippage_x_stretch

  - label: chain_yz_minus_and_slippage
    chain: ARAP_minus_yz_stretch, slippage_x_stretch


  - label: ARAP_y_stretch
    method: ARAP
    constrained_ids: &wrench_constraints [33, 12, 944, 942, 148, 273, 149, 151, 316, 271, 150, 947, 270,
      951, 949, 32, 283, 13, 757, 152, 749, 153, 154, 524, 279, 771, 272, 946, 945,
      943, 21, 315, 11, 194, 195, 196, 22, 197, 848, 116, 114, 115, 8, 24, 296, 217,
      218, 219, 220, 221, 222, 223, 224, 950, 948, 185, 184, 6, 7, 109, 246, 245,
      244, 243, 242, 241, 240, 239, 238, 237, 236, 247, 290, 1247, 1238, 166, 162,
      1213, 284, 285, 286, 1131, 301, 1193, 1171, 1163, 1160, 855, 870, 866, 876,
      124, 1154, 304, 871, 129, 134, 268, 267, 266, 794, 177, 528, 167, 159, 537,
      311, 307, 10, 783, 604, 532, 657, 665, 180, 811, 820, 120, 607, 118, 539, 145,
      548, 520, 577, 131, 551, 538, 606, 183, 5, 4, 104, 28, 293, 17, 18, 294, 27,
      20, 295, 25, 521, 514, 509, 233, 234, 93, 61, 731, 726]
    reshaped_ids: &wrench_handles [5, 4, 104, 28, 293, 17, 18, 294, 27, 20, 295, 25, 521, 514, 509,
      233, 234, 93, 61, 731, 726]
    reshaped_vector: [0.0, 1.0, 0.0]
    range: [-0.025, 0.025]

  - label: ARAP_z_stretch
    method: ARAP
    constrained_ids: *wrench_constraints
    reshaped_ids: *wrench_handles
    reshaped_vector: [0.0, 0.0, 1.0]
    range: [-0.025, 0.025]

  - label: ARAP_yz_stretch
    method: ARAP
    constrained_ids: *wrench_constraints
    reshaped_ids: *wrench_handles
    reshaped_vector: [0.0, 0.7071067811865476, 0.7071067811865476]
    range: [-0.025, 0.025]


  - label: ARAP_minus_yz_stretch
    method: ARAP
    constrained_ids: *wrench_constraints
    reshaped_ids: *wrench_handles
    reshaped_vector: [0.0, -0.7071067811865476, 0.7071067811865476]
    range: [-0.025, 0.025]

  - label: slippage_x_stretch
    constrained_ids: *wrench_constraints
    reshaped_ids: *wrench_handles
    reshaped_vector: [1.0, 0.0, 0.0]
    range: [-0.025, 0.015]
