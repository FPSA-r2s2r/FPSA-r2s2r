name: FPSA_Assembly

shape_meta: &shape_meta
  # acceptable types: rgb, low_dim
  obs:
    agentview_image:
      shape: [3, 224, 224]
      type: rgb
    robot0_eye_in_hand_image:
      shape: [3, 224, 224]
      type: rgb
    robot0_eef_pos:
      shape: [3]
      # type default: low_dim
    robot0_eef_quat:
      shape: [4]
    robot0_gripper_qpos:
      shape: [1]
  action: 
    shape: [8] # pos, quaternion, gripper

task_name: &task_name FPSA_Assembly
dataset_type: &dataset_type ph
dataset_path: &dataset_path ./data/DP_data/Assembly/FPSA_Assembly.zarr
abs_action: &abs_action True

env_runner:
  _target_: diffusion_policy.env_runner.FPSA_Assembly_runner.AssemblyEnvRunner
  # dataset_path: *dataset_path
  # shape_meta: *shape_meta
  use_agent_cam: True
  use_fisheye_cam: True
  n_train: 10
  max_steps: 250
  n_train_vis: 2
  # train_start_idx: 0
  n_test: 40
  n_test_vis: 4
  train_start_seed: 46
  test_start_seed: 20043
  n_obs_steps: ${n_obs_steps}
  n_action_steps: ${n_action_steps}
  # render_obs_key: 'agentview_image'
  fps: 10
  crf: 22
  # past_action: ${past_action_visible}
  # abs_action: *abs_action
  # tqdm_interval_sec: 1.0
  n_envs: 10
  # this needs at least 16 GB of memory

dataset:
  _target_: diffusion_policy.dataset.PhyFisheyeImageDataset.PhyFisheyeImageDataset
  zarr_path: *dataset_path
  # dataset_path: *dataset_path
  horizon: ${horizon}
  pad_before: ${eval:'${n_obs_steps}-1+${n_latency_steps}'}
  pad_after: ${eval:'${n_action_steps}-1'}
  n_obs_steps: ${eval:'${dataset_obs_steps} if ${obs_as_global_cond} else ${horizon}'}
  # abs_action: *abs_action
  # rotation_rep: 'rotation_6d'
  # use_legacy_normalizer: False
  # use_cache: True
  seed: 42
  val_ratio: 0.02
